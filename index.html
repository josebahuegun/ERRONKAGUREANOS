<!DOCTYPE html>
<html lang="eu">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #1d2671, #c33764);
    height: 100vh;
}
.card { border-radius: 15px; transition: 0.3s; }
.card:hover { transform: scale(1.03); }
</style>

<title>Login</title>
</head>

<body class="d-flex align-items-center">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">

      <div class="card p-4 shadow-lg border-0">
        <h3 class="text-center mb-3">🔐 Login</h3>

        <input type="text" id="user" class="form-control mb-2" placeholder="Erabiltzailea">
        <input type="password" id="pass" class="form-control mb-3" placeholder="Pasahitza">

        <button class="btn btn-primary w-100" onclick="login()">Sartu</button>
      </div>

    </div>
  </div>
</div>

<script>
function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    if(user === "admin" && pass === "1234") {
        localStorage.setItem("rol", "admin");
        window.location.href = "admin.html";
    }
    else if(user === "user" && pass === "1234") {
        localStorage.setItem("rol", "user");
        window.location.href = "user.html";
    }
    else {
        alert("Datu okerrak");
    }
}
</script>

</body>
</html>
