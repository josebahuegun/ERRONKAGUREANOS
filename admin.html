<!DOCTYPE html>
<html lang="eu">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1041/1041916.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.card:hover {
    transform: scale(1.05);
    transition: 0.3s;
}
</style>

<script>
if(localStorage.getItem("rol") !== "admin") {
    window.location.href = "index.html";
}
</script>

<title>Admin Panela</title>
</head>

<body>

<div class="container mt-5">

<h1 class="text-center mb-5">⚙️ Admin Panela</h1>

<div class="row">

<div class="col-12 col-md-4 mb-4">
<div class="card p-4 text-center shadow border-0">
<h4>📦 Aplikazioa</h4>
<p>Deskargatu gure programa</p>
<a href="files/app.zip" class="btn btn-success">Deskargatu</a>
</div>
</div>

<div class="col-12 col-md-4 mb-4">
<div class="card p-4 shadow border-0">
<h4 class="text-center">🎥 Bideo azalpena</h4>
<video class="w-100 mt-2" controls>
<source src="files/video.mp4" type="video/mp4">
</video>
</div>
</div>

<div class="col-12 col-md-4 mb-4">
<div class="card p-4 text-center shadow border-0">
<h4>📄 Dokumentazioa</h4>
<p>Programa nola funtzionatzen duen</p>
<a href="files/dokumentazioa.pdf" class="btn btn-primary">Ikusi PDF</a>
</div>
</div>

</div>

<button class="btn btn-danger mt-4 w-100" onclick="logout()">Irten</button>

</div>

<script>
function logout() {
    localStorage.removeItem("rol");
    window.location.href = "index.html";
}
</script>

</body>
</html>
