<!DOCTYPE html>
<html lang="eu">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Admin Login</title>
</head>

<body class="bg-dark d-flex align-items-center" style="height:100vh;">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-6 col-md-4">

      <div class="card p-4 shadow">
        <h3 class="text-center mb-3">Admin Login</h3>

        <input type="text" id="user" class="form-control mb-2" placeholder="Erabiltzailea">
        <input type="password" id="pass" class="form-control mb-3" placeholder="Pasahitza">

        <button class="btn btn-primary w-100" onclick="login()">Sartu</button>
      </div>

    </div>
  </div>
</div>

<script>
function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    if(user === "admin" && pass === "1234") {
        localStorage.setItem("rol", "admin");
        window.location.href = "admin.html";
    } else {
        alert("Datu okerrak");
    }
}
</script>

</body>
</html>
