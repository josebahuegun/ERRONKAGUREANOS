<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Kontaktua</title>
</head>

<body>

<div class="container mt-5">
<h2 class="mb-4">Kontaktua</h2>

<p>Jarri gurekin harremanetan zalantzak edo informazio gehiago eskatzeko.</p>

<div class="mb-3">
<label>Izena</label>
<input type="text" id="izena" class="form-control">
</div>

<div class="mb-3">
<label>Emaila</label>
<input type="email" id="emaila" class="form-control">
</div>

<div class="mb-3">
<label>Mezua</label>
<textarea id="mezua" class="form-control"></textarea>
</div>

<button class="btn btn-primary" onclick="enviar()">Bidali</button>

</div>

<script>
function enviar() {
    let izena = document.getElementById("izena").value;
    let emaila = document.getElementById("emaila").value;
    let mezua = document.getElementById("mezua").value;

    if(izena === "" || emaila === "" || mezua === "") {
        alert("Mesedez, bete eremu guztiak");
        return;
    }

    let url = "jhuegun25@izarraitz.eus"
        + "?subject=Kontaktua"
        + "&body=Izena: " + izena
        + "%0AEmaila: " + emaila
        + "%0AMezua: " + mezua;

    window.location.href = url;
}
</script>

</body>
</html>
